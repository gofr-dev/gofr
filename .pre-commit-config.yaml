---
# Blocks compiled binaries from being committed anywhere in the repo — including
# extensionless Go binaries, which is what leaked into development in #3854 and
# which .gitignore globs can't reliably catch. Existing legitimate image/zip
# assets (docs images, favicons, test.zip) are excluded by name so the check
# stays green on the current tree.
repos:
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: forbid-binary
        exclude: '\.(gif|jpe?g|png|webp|ico|zip)$'
