---
version: 2
updates:
  - package-ecosystem: "gomod"
    open-pull-requests-limit: 10  # avoid spam, if no one reacts
    # The tree has 34 go.mod directories (`git ls-files '*go.mod' | wc -l`, so
    # the number stays checkable). The globs below must cover all of
    # them — `pkg/gofr/metrics/exporters/gcp` was matched by none of the
    # original entries and so received no dependency updates at all, despite
    # vendoring the GCP client libraries. When adding a module outside these
    # paths, add its glob here too; nothing fails loudly when one is missed.
    directories:
      - "/"
      - "/examples/*"
      - "/pkg/gofr/datasource/*"
      - "/pkg/gofr/datasource/file/*"
      - "/pkg/gofr/datasource/kv-store/*"
      - "/pkg/gofr/datasource/pubsub/*"
      - "/pkg/gofr/metrics/exporters/*"
      - "/pkg/gofr/traces/exporters/*"
    schedule:
      interval: "weekly"
    # Without a `groups:` block every bumped module gets its own PR, and with
    # `directories:` covering 32 modules a single dependency bumped in four of
    # them becomes four PRs. The 2026-09-22 run produced 21 gomod PRs this way,
    # while the grouped github-actions and docker entries produced one each.
    #
    # Grouping with `directories:` (plural) emits ONE cross-directory PR per
    # group — "bump the <group> group across N directories" — so these six
    # groups turn a week like that into roughly five reviewable PRs.
    #
    # Grouped by vendor rather than into one bucket on purpose: when an AWS SDK
    # bump has to be reverted it should not take the OpenTelemetry and Azure
    # bumps out with it. `go-deps` is the catch-all and must stay last; a
    # dependency matches the first group whose patterns it satisfies.
    #
    # Only minor and patch are grouped. Major bumps stay ungrouped and so still
    # arrive as one PR each, which is what a major deserves.
    groups:
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
        update-types: ["minor", "patch"]
      azure-sdk:
        patterns:
          - "github.com/Azure/*"
          - "github.com/AzureAD/*"
        update-types: ["minor", "patch"]
      google:
        patterns:
          - "cloud.google.com/*"
          - "google.golang.org/*"
        update-types: ["minor", "patch"]
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
        update-types: ["minor", "patch"]
      golang-x:
        patterns:
          - "golang.org/x/*"
        update-types: ["minor", "patch"]
      go-deps:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 10  # avoid spam, if no one reacts
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"

  # Base images were previously unmanaged entirely, which is how
  # examples/http-server sat on alpine:3.14 — end-of-support 2023-05-01, so no
  # musl/busybox/OpenSSL patches for over three years. Grouped so a weekly
  # patch bump across the 11 Dockerfiles arrives as one PR rather than 11.
  - package-ecosystem: "docker"
    open-pull-requests-limit: 10  # avoid spam, if no one reacts
    directories:
      - "/"
      - "/docs"
      - "/examples/*"
    schedule:
      interval: "weekly"
    groups:
      docker:
        update-types:
          - "minor"
          - "patch"

