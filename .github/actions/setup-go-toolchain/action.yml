name: Set up Go toolchain
description: >
  Allow the go.work toolchain upgrade, and make sure it resolves to a real,
  writable SDK rather than a read-only toolchain module.

runs:
  using: composite
  steps:
    # setup-go@v7 defaults GOTOOLCHAIN=local, while go.work pins a newer Go than
    # the older matrix versions install, so the toolchain has to be allowed to
    # upgrade.
    #
    # GOTOOLCHAIN=auto on its own is not enough. Left to itself the go command
    # satisfies the upgrade by downloading a *toolchain module* into the
    # read-only module cache. Go 1.26 no longer ships `covdata` prebuilt in
    # pkg/tool — it builds the tool into GOROOT on demand — and a
    # toolchain-module GOROOT does not permit that, so `go test -coverpkg` fails
    # with `go: no such tool "covdata"` for packages that have no test files.
    # Installing the version go.work asks for as a real SDK first makes the
    # toolchain switch resolve it from PATH instead, against a writable GOROOT.
    #
    # Only the Example job has been observed failing this way, but every job that
    # builds with coverage is exposed to it, so all of them go through here.
    - name: Allow Go toolchain auto-upgrade
      shell: bash
      run: |
        set -eo pipefail
        echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

        required=$(awk '$1 == "go" { print $2; exit }' go.work)
        current=$(go env GOVERSION); current=${current#go}

        # Nothing to do when setup-go already gave us a new enough SDK.
        if [ "$current" = "$required" ] || \
           [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -1)" = "$required" ]; then
          echo "installed Go $current already satisfies go.work ($required)"
          exit 0
        fi

        echo "materialising Go $required as a real SDK for the toolchain switch"
        GOTOOLCHAIN=local go install "golang.org/dl/go$required@latest"
        "$(go env GOPATH)/bin/go$required" download
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
